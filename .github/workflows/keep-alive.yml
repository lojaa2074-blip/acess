name: Supabase Keep-Alive

on:
  schedule:
    # Todo dia às 09:17 UTC (minuto fora de hora cheia evita atrasos/descartes do GitHub)
    - cron: '17 9 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar registro de heartbeat no Supabase
        run: |
          RESPONSE=$(curl -sS --fail-with-body --retry 3 --retry-delay 5 \
            -X PATCH "${SUPABASE_URL}/rest/v1/heartbeat?id=eq.1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"atualizado_em\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          echo "Resposta: $RESPONSE"
          if [ -z "$RESPONSE" ] || [ "$RESPONSE" = "[]" ]; then
            echo "Nenhuma linha foi atualizada (id=1 não existe ou RLS bloqueou)."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
