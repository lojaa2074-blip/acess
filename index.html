<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Access</title>
<link rel="stylesheet" href="style.css">

<!-- PWA -->
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0d2f4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Access">

<!-- Ícones -->
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>
<body>

  <!-- Tela de bloqueio -->
  <div id="lockScreen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-icon">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h2>Acesso restrito</h2>
      <p>Digite a senha para continuar</p>
      <form id="lockForm">
        <input type="password" id="lockPassword" placeholder="Senha" autocomplete="off" required>
        <p id="lockError" class="lock-error" style="display:none;">Senha incorreta.</p>
        <button type="submit" class="btn btn-primary lock-btn">Entrar</button>
      </form>
    </div>
  </div>

  <div id="appContent" class="app-content" style="display:none;">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Access</h1>
      </div>
      <button id="btnAdd" class="btn btn-primary">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Incluir
      </button>
    </div>
    <div class="topbar-inner search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Buscar por código, nome ou CNPJ...">
      </div>
    </div>
  </header>

  <main class="content">
    <div id="listWrap" class="list-wrap">
      <!-- cabeçalho (somente desktop) -->
      <div class="row row-head" id="tableHead">
        <div class="col col-codigo">Código</div>
        <div class="col col-nome">Nome</div>
        <div class="col col-cnpj">CNPJ</div>
        <div class="col col-senha">Senha</div>
        <div class="col col-acoes">Excluir</div>
      </div>

      <div id="rowsContainer"></div>

      <div id="emptyState" class="empty-state" style="display:none;">
        <p>Nenhum registro encontrado.</p>
        <button id="btnAddEmpty" class="btn btn-primary">Incluir o primeiro registro</button>
      </div>

      <div id="loadingState" class="loading-state">
        <div class="spinner"></div>
        <p>Carregando registros...</p>
      </div>
    </div>
  </main>

  </div>

  <!-- Modal de incluir / editar -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2 id="modalTitle">Incluir registro</h2>
      <form id="modalForm">
        <label>Código
          <input type="text" id="fieldCodigo" required>
        </label>
        <label>Nome
          <input type="text" id="fieldNome" required>
        </label>
        <label>CNPJ
          <input type="text" id="fieldCnpj" placeholder="00000000000000" inputmode="numeric" maxlength="14" pattern="\d{14}" title="Digite os 14 números do CNPJ, sem ponto ou traço" required>
        </label>
        <label>Senha
          <div class="input-icon-wrap">
            <input type="password" id="fieldSenha" required>
            <button type="button" id="toggleFieldSenha" class="input-icon-btn" title="Mostrar senha">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </label>
        <input type="hidden" id="fieldId">
        <div class="modal-actions">
          <button type="button" id="btnCancel" class="btn btn-ghost">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de confirmação de exclusão -->
  <div id="deleteOverlay" class="modal-overlay">
    <div class="modal modal-small">
      <h2>Excluir registro</h2>
      <p id="deleteText" class="delete-text">Tem certeza que deseja excluir este registro? Essa ação não pode ser desfeita.</p>
      <div class="modal-actions">
        <button type="button" id="btnCancelDelete" class="btn btn-ghost">Cancelar</button>
        <button type="button" id="btnConfirmDelete" class="btn btn-danger">Excluir</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.error("Falha ao registrar o service worker:", err);
        });
      });
    }
  </script>
</body>
</html>
